</tr>
</thead>

<script>

const now = new Date();

const japanDate = new Intl.DateTimeFormat('ja-JP', {
    timeZone:'Asia/Tokyo',
    year:'numeric',
    month:'numeric'
}).formatToParts(now);

let currentYear = "2026";
let currentMonth = "5";

japanDate.forEach(p=>{
    if(p.type === "year") currentYear = p.value;
    if(p.type === "month") currentMonth = p.value;
});

document.getElementById("year").value = currentYear;
document.getElementById("month").value = currentMonth;

document.getElementById("compare1").value = String(Number(currentYear)-1);
document.getElementById("compare2").value = String(Number(currentYear)-2);
document.getElementById("compare3").value = String(Number(currentYear)-3);

const categoryNames = {
    electric:"⚡ 電気",
    gas:"🔥 ガス",
    water:"🚰 水道"
};

function getData(){
    return JSON.parse(localStorage.getItem("utility_final_stable") || "[]");
}

function saveData(){

    const category = document.getElementById("category").value;
    const year = document.getElementById("year").value;
    const month = document.getElementById("month").value;
    const usage = document.getElementById("usage").value;
    const cost = document.getElementById("cost").value;

    if(cost === "") {
        alert("料金を入力してください");
        return;
    }

    const data = getData();

    data.push({
        category,
        year,
        month,
        usage:Number(usage || 0),
        cost:Number(cost)
    });

    localStorage.setItem("utility_final_stable", JSON.stringify(data));

    document.getElementById("usage").value = "";
    document.getElementById("cost").value = "";

    updateUI();
}

let chart;

function updateUI(){

    const data = getData();

    const history = document.getElementById("history");

    history.innerHTML = "";

    data.forEach(item=>{

        const row = document.createElement("tr");

        row.innerHTML = `
        <td>${categoryNames[item.category]}</td>
        <td>${item.year}/${item.month}</td>
        <td>${item.usage}</td>
        <td>${item.cost.toLocaleString()}円</td>
        `;

        history.appendChild(row);

    });

    drawChart(data);
}

function totals(data, year){

    const arr = [];

    for(let i=1;i<=12;i++){

        let total = 0;

        data.forEach(item=>{

            if(item.year == year && Number(item.month) === i){
                total += item.cost;
            }

        });

        arr.push(total);
    }

    return arr;
}

function drawChart(data){

    const labels = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

    const compare1 = document.getElementById("compare1").value;
    const compare2 = document.getElementById("compare2").value;
    const compare3 = document.getElementById("compare3").value;

    if(chart) {
        chart.destroy();
    }

    chart = new Chart(document.getElementById("chart"), {
        type:"line",
        data:{
            labels:labels,
            datasets:[
                {
                    label: currentYear + "年",
                    data: totals(data, currentYear)
                },
                {
                    label: compare1 + "年",
                    data: totals(data, compare1)
                },
                {
                    label: compare2 + "年",
                    data: totals(data, compare2)
                },
                {
                    label: compare3 + "年",
                    data: totals(data, compare3)
                }
            ]
        }
    });
}

document.getElementById("compare1").addEventListener("change", updateUI);
document.getElementById("compare2").addEventListener("change", updateUI);
document.getElementById("compare3").addEventListener("change", updateUI);

function resetData(){

    if(confirm("全削除しますか？")){

        localStorage.removeItem("utility_final_stable");

        updateUI();
    }
}

updateUI();

</script>
